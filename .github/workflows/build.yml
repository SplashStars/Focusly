# ──────────────────────────────────────────────────────────────────────────
# Focusly – GitHub Actions build workflow
# v1.1.0
#
# Triggers:
#   • Push to main → builds debug APK automatically
#   • Manual trigger → choose debug, release APK, or playstore AAB
#
# Artifacts produced:
#   • focusly-debug-apk      (always)   – install directly on phone for testing
#   • focusly-release-apk   (manual)   – unsigned release APK
#   • focusly-play-store-aab (manual)  – signed AAB for Google Play upload
# ──────────────────────────────────────────────────────────────────────────

name: Build Focusly APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - playstore

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 2b. Cache Gradle dependencies ─────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      # ── 4. Android licenses ────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── 6. Flutter packages ────────────────────────────────────────────────
      - name: Install Flutter packages
        working-directory: focusly
        run: flutter pub get

      # ── 6a. Launcher icons ─────────────────────────────────────────────────
      # Generates the REAL Focusly icon (purple/gold) into every mipmap density
      # from assets/icon/app_icon.png, so the installed launcher icon matches
      # the Play Store hi-res icon exactly.
      # NOTE: this previously copied the default Flutter template icons, which
      # shipped the stock Flutter logo and caused a Play policy rejection.
      - name: Generate launcher icons
        working-directory: focusly
        run: |
          dart run flutter_launcher_icons
          echo "--- generated mipmaps ---"
          ls -R android/app/src/main/res/mipmap-* || true

      - name: Verify launcher icon is not the Flutter default
        working-directory: focusly
        run: |
          if [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "ERROR: launcher icon was not generated"; exit 1
          fi
          echo "Launcher icon present:"
          ls -l android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # ── 6b. Decode keystore (playstore builds only) ────────────────────────
      - name: Decode release keystore
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/focusly-release.keystore
          echo "Keystore decoded: $(ls -lh /tmp/focusly-release.keystore)"

      # ── 7a. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        working-directory: focusly
        run: flutter build apk --debug --verbose

      - name: Upload debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-debug-apk
          path: focusly/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── 7b. Build release APK (manual trigger only) ───────────────────────
      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: focusly
        run: flutter build apk --release --verbose

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-release-apk
          path: focusly/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── 7c. Build signed release AAB for Google Play (playstore only) ──────
      - name: Build signed release AAB
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        working-directory: focusly
        env:
          KEYSTORE_FILE: /tmp/focusly-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB for Google Play
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-play-store-aab
          path: focusly/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 8. Print result ────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "======================================="
          echo "  Focusly v$(grep '^version:' focusly/pubspec.yaml | cut -d' ' -f2) build complete!"
          echo "  Download the artifact from the Actions tab."
          echo "======================================="
 
