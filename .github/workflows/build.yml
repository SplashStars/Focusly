# ──────────────────────────────────────────────────────────────────────────
# Focusly – GitHub Actions build workflow
# v1.1.0
#
# Triggers:
#   • Push to main → builds debug APK automatically
#   • Manual trigger → choose debug, release APK, or playstore AAB
#
# Artifacts produced:
#   • focusly-debug-apk      (always)   – install directly on phone for testing
#   • focusly-release-apk   (manual)   – unsigned release APK
#   • focusly-play-store-aab (manual)  – signed AAB for Google Play upload
# ──────────────────────────────────────────────────────────────────────────

name: Build Focusly APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - playstore
          - screenshots

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 2b. Cache Gradle dependencies ─────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      # ── 4. Android licenses ────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── 6. Flutter packages ────────────────────────────────────────────────
      - name: Install Flutter packages
        working-directory: focusly
        run: flutter pub get

      # ── 6a. Launcher icons ─────────────────────────────────────────────────
      # Generates the REAL Focusly icon (purple/gold) into every mipmap density
      # from assets/icon/app_icon.png, so the installed launcher icon matches
      # the Play Store hi-res icon exactly.
      # NOTE: this previously copied the default Flutter template icons, which
      # shipped the stock Flutter logo and caused a Play policy rejection.
      - name: Generate launcher icons
        working-directory: focusly
        run: |
          dart run flutter_launcher_icons
          echo "--- generated mipmaps ---"
          ls -R android/app/src/main/res/mipmap-* || true

      - name: Verify launcher icon is not the Flutter default
        working-directory: focusly
        run: |
          if [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "ERROR: launcher icon was not generated"; exit 1
          fi
          echo "Launcher icon present:"
          ls -l android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # ── 6b. Decode keystore (playstore builds only) ────────────────────────
      - name: Decode release keystore
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'playstore' || github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/focusly-release.keystore
          echo "Keystore decoded: $(ls -lh /tmp/focusly-release.keystore)"

      # ── 7a. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        working-directory: focusly
        run: flutter build apk --debug --verbose

      - name: Upload debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-debug-apk
          path: focusly/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── 7b. Build SIGNED release APK ──────────────────────────────────────
      # Built on every push, not just on demand. A debug APK is signed with
      # the public Android debug key and carries android:debuggable="true";
      # on-device antivirus (AVG, Avast, McAfee) flags that combination as a
      # suspicious app. The signed release APK is neither debuggable nor
      # debug-signed, so it installs cleanly for real-world testing.
      - name: Build signed release APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}
        working-directory: focusly
        env:
          KEYSTORE_FILE: /tmp/focusly-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify release APK is signed and not debuggable
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}
        working-directory: focusly
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/2* 2>/dev/null | sort | tail -1)
          echo "Using build-tools: $BT"
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            echo "--- signing certificate ---"
            "$BT/apksigner" verify --print-certs "$APK" | grep -Ei "certificate DN|SHA-256 digest" || true
            if "$BT/apksigner" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
              echo "ERROR: release APK is signed with the public Android debug key"
              exit 1
            fi
            echo "OK: not debug-signed"
          fi
          if [ -n "$BT" ] && [ -x "$BT/aapt2" ]; then
            if "$BT/aapt2" dump badging "$APK" 2>/dev/null | grep -q "application-debuggable"; then
              echo "ERROR: release APK is debuggable"
              exit 1
            fi
            echo "OK: not debuggable"
          fi

      - name: Upload release APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-release-apk
          path: focusly/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── 7c. Build signed release AAB for Google Play (playstore only) ──────
      - name: Build signed release AAB
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        working-directory: focusly
        env:
          KEYSTORE_FILE: /tmp/focusly-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB for Google Play
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        uses: actions/upload-artifact@v4
        with:
          name: focusly-play-store-aab
          path: focusly/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 7d. Publish AAB to dist/ so it can be fetched directly ─────────────
      # raw.githubusercontent.com serves this with permissive CORS headers,
      # which allows the release bundle to be retrieved without a token.
      - name: Publish AAB to dist branch
        if: ${{ github.event.inputs.build_type == 'playstore' }}
        run: |
          mkdir -p dist
          cp focusly/build/app/outputs/bundle/release/app-release.aab dist/app-release.aab
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' focusly/android/app/build.gradle | head -1)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' focusly/android/app/build.gradle | head -1)
          sha256sum dist/app-release.aab | awk '{print $1}' > dist/app-release.aab.sha256
          printf '{"versionCode":"%s","versionName":"%s","built":"%s","size":%s}\n' \
            "$VC" "$VN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(stat -c%s dist/app-release.aab)" > dist/build-info.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/app-release.aab dist/app-release.aab.sha256 dist/build-info.json
          git commit -m "Publish AAB v$VN (versionCode $VC) [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push origin HEAD:main
          echo "Published: dist/app-release.aab"
          cat dist/build-info.json

      # ── 8. Print result ────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "======================================="
          echo "  Focusly v$(grep '^version:' focusly/pubspec.yaml | cut -d' ' -f2) build complete!"
          echo "  Download the artifact from the Actions tab."
          echo "======================================="

  # ────────────────────────────────────────────────────────────────────────────
  # Screenshot capture — boots a real Android emulator, installs the app and
  # captures genuine screenshots of every tab. Used for the Play Store listing
  # so the screenshots provably match the shipped binary.
  # ────────────────────────────────────────────────────────────────────────────
  screenshots:
    if: ${{ github.event.inputs.build_type == 'screenshots' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        working-directory: focusly
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: focusly
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        working-directory: focusly
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture_screenshots.sh

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusly-screenshots
          path: screenshots/
          retention-days: 30

      - name: Publish screenshots to dist/
        run: |
          mkdir -p dist/screenshots
          cp screenshots/*.png dist/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/screenshots
          git commit -m "Publish store screenshots [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push origin HEAD:main
          ls -la dist/screenshots/
