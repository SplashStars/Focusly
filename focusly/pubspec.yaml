name: focusly
description: Focusly - Your Daily Planner. Tasks, habits & projects in one beautiful app.
publish_to: 'none'
version: 1.1.2+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (no internet required)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Push notifications & reminders (FREE for all users)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.2

  # Monetisation: one-time unlock, or free with Google AdMob adverts.
  # 3.3.0+ pulls in_app_purchase_android 0.5.x, which upgrades the Google Play
  # Billing Library from 7.1.1 to 8.0.0 - mandatory for Play submissions since
  # 31 Aug 2026.
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^5.2.0

  # Beautiful UI
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Launcher icon generation - generates the real Focusly icon into every mipmap
# density so the installed launcher icon matches the Play Store hi-res icon.
# Run with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
