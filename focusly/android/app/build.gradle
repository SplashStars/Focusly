plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

android {
    namespace "com.splashstars.focusly"
    // compileSdk must be >= targetSdk
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }

    defaultConfig {
        applicationId "com.splashstars.focusly"
        minSdk 23
        // Google Play requires target API 36 for submissions from 31 Aug 2026.
        targetSdk 36
        versionCode 11
        versionName "1.1.2"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("STORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            def hasKeystore = System.getenv("KEYSTORE_FILE") != null
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            // Play's code-optimization requirement: R8 shrinks and optimises
            // the app and emits the mapping.txt Play uses for crash reports.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter { source "../.." }

configurations.all {
    resolutionStrategy {
        // Play requires Billing Library 8.0.0+ for submissions from 31 Aug 2026.
        // in_app_purchase_android 0.5.x ships 8.0.0; this pin guards against an
        // older transitive version being pulled in.
        force "com.android.billingclient:billing:8.0.0"
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
}
