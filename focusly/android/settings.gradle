pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2/' }  // mirror: avoids 403 from repo.maven.apache.org on GH runners
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.9.1+ is required by androidx.core 1.17.x, which url_launcher pulls in.
    // Bumping AGP (rather than forcing androidx.core backwards) keeps the
    // plugin running against the version it was compiled for.
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.23" apply false
}

include ":app"
